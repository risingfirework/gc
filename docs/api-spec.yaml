openapi: 3.0.3
info:
  title: TKA CBT Platform API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://spdx.org/licenses/LicenseRef-Proprietary.html
  description: |
    Kontrak REST API untuk autentikasi, katalog dan pembayaran, CBT autosave,
    submit ujian, serta hasil analitik. Semua waktu menggunakan ISO 8601 UTC.
servers:
  - url: /
    description: Same host as the served API documentation
tags:
  - name: Authentication
    description: Registration, login, active-session replacement, and logout.
  - name: Packages
    description: Public tryout package catalog.
  - name: Commerce
    description: Checkout transactions and payment gateway notifications.
  - name: CBT
    description: Exam start, answer autosave, and submission.
  - name: Analytics
    description: Submitted exam scores and subject breakdowns.

paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register student account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login and establish the active device session
      description: A successful login replaces the previous JTI stored in Redis.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the active session
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Session successfully revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/packages:
    get:
      tags: [Packages]
      summary: List available tryout packages
      operationId: listPackages
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Package list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/transactions/checkout:
    post:
      tags: [Commerce]
      summary: Create a package checkout transaction
      operationId: checkoutPackage
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key generated by the client to prevent duplicate checkout.
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/webhooks/payment:
    post:
      tags: [Commerce]
      summary: Receive a payment gateway status notification
      description: The implementation must verify the signature and process event_id idempotently.
      operationId: paymentWebhook
      security:
        - WebhookSignature: []
      parameters:
        - name: X-Payment-Timestamp
          in: header
          required: true
          description: Unix timestamp in seconds; requests older than five minutes are rejected.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Webhook accepted, including previously processed events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/exams/{id}/start:
    get:
      tags: [CBT]
      summary: Start or resume an exam
      description: |
        The path id is `exams.id`. This operation is idempotent while an ongoing
        attempt exists and returns time derived from the server clock.
      operationId: startExam
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Exam UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exam attempt started or resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cbt/answers/sync:
    post:
      tags: [CBT]
      summary: Synchronize one or more answers
      description: Idempotent upsert used by the real-time autosave client.
      operationId: syncAnswers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSyncRequest'
      responses:
        '200':
          description: Answers synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/exams/{id}/submit:
    post:
      tags: [CBT]
      summary: Submit an exam attempt
      description: The path id is `user_exams.id`, not the exam master ID.
      operationId: submitExam
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User exam attempt UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExamRequest'
      responses:
        '200':
          description: Attempt submitted and scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitExamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/exams/{id}/result:
    get:
      tags: [Analytics]
      summary: Get a submitted exam result
      description: The path id is `user_exams.id`.
      operationId: getExamResult
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User exam attempt UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exam result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Exam is still ongoing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/rankings/global:
    get:
      tags: [Analytics]
      summary: Get the global student ranking
      description: Returns each student's best submitted exam score, ordered from highest to lowest.
      operationId: getGlobalRanking
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global ranking, limited to 100 students
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalRankingEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token. The token JTI must match the active Redis session.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: HMAC signature supplied by the configured payment gateway.

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or replaced session token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SESSION_INVALID
            message: Device Limit Reached / Session Invalid
            request_id: req_01JXYZ
    Forbidden:
      description: Authenticated user cannot access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until another request may be attempted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    User:
      type: object
      required: [id, email, role, school_level, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, admin]
        school_level:
          type: string
          enum: [SD, SMP, SMA]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, school_level]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
        school_level:
          type: string
          enum: [SD, SMP, SMA]

    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        device_id:
          type: string
          description: Optional client identifier for audit metadata; JTI remains authoritative.
          maxLength: 200

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        user:
          $ref: '#/components/schemas/User'

    Package:
      type: object
      required: [id, title, description, price, validity_days, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        validity_days:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    PackageListResponse:
      type: object
      required: [data, page, per_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Package'
        page:
          type: integer
        per_page:
          type: integer

    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [package_id, payment_method]
      properties:
        package_id:
          type: string
          format: uuid
        payment_method:
          type: string
          enum: [qris, virtual_account, e_wallet]

    Transaction:
      type: object
      required: [id, user_id, package_id, invoice_number, amount, payment_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        package_id:
          type: string
          format: uuid
        invoice_number:
          type: string
        amount:
          type: number
          format: double
          minimum: 0
        payment_status:
          type: string
          enum: [pending, paid, failed, expired, refunded]
        payment_method:
          type: string
          nullable: true
        payment_url:
          type: string
          format: uri
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CheckoutResponse:
      type: object
      required: [transaction, payment_url, expires_at]
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
        payment_url:
          type: string
          format: uri
        qr_string:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time

    PaymentWebhookRequest:
      type: object
      additionalProperties: false
      required: [event_id, invoice_number, payment_status, amount]
      properties:
        event_id:
          type: string
          maxLength: 200
        invoice_number:
          type: string
          maxLength: 100
        payment_status:
          type: string
          enum: [paid, failed, expired, refunded]
        payment_method:
          type: string
          nullable: true
        amount:
          type: number
          format: double
          minimum: 0
        paid_at:
          type: string
          format: date-time
          nullable: true

    WebhookResponse:
      type: object
      required: [received, processed]
      properties:
        received:
          type: boolean
        processed:
          type: boolean
          description: False when event_id was already processed.

    ExamQuestion:
      type: object
      description: Correct answer is intentionally excluded.
      required: [id, subject_name, content_text, options]
      properties:
        id:
          type: string
          format: uuid
        subject_name:
          type: string
        content_text:
          type: string
          description: Plain text with optional LaTeX expressions.
          example: 'Jika $2x + 4 = 10$, nilai $x$ adalah ...'
        options:
          type: array
          minItems: 2
          items:
            type: object
            required: [key, content]
            properties:
              key:
                type: string
                example: A
              content:
                type: string
                example: '3'

    ExamStartResponse:
      type: object
      required: [user_exam_id, exam_id, title, status, server_time, started_at, ends_at, duration_minutes, questions]
      properties:
        user_exam_id:
          type: string
          format: uuid
        exam_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [ongoing]
        server_time:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ExamQuestion'

    AnswerSyncRequest:
      type: object
      additionalProperties: false
      required: [exam_id, question_id, selected_option]
      properties:
        exam_id:
          type: string
          format: uuid
          description: Active attempt UUID from user_exams.id.
        question_id:
          type: string
          format: uuid
        selected_option:
          type: string
          maxLength: 100

    AnswerSyncResponse:
      type: object
      required: [saved, synced_at, remaining_seconds]
      properties:
        saved:
          type: boolean
        synced_at:
          type: string
          format: date-time
        remaining_seconds:
          type: integer
          format: int64
          minimum: 0

    SubmitExamRequest:
      type: object
      additionalProperties: false
      properties:
        client_finished_at:
          type: string
          format: date-time
          description: Audit information only; scoring uses server time and persisted answers.

    SubmitExamResponse:
      type: object
      required: [user_exam_id, exam_id, status, finished_at, total_score, passing_score, passed]
      properties:
        user_exam_id:
          type: string
          format: uuid
        exam_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitted]
        finished_at:
          type: string
          format: date-time
        total_score:
          type: number
          format: double
        passing_score:
          type: number
          format: double
        passed:
          type: boolean

    SubjectResult:
      type: object
      required: [subject_name, correct_answers, wrong_answers, unanswered, total_questions, score]
      properties:
        subject_name:
          type: string
        correct_answers:
          type: integer
        wrong_answers:
          type: integer
        unanswered:
          type: integer
        total_questions:
          type: integer
        score:
          type: number
          format: double

    ExamResultResponse:
      type: object
      required: [user_exam_id, exam_id, title, status, scoring_method, started_at, finished_at, total_score, passing_score, passed, correct_answers, wrong_answers, unanswered, subjects, review]
      properties:
        user_exam_id:
          type: string
          format: uuid
        exam_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [submitted]
        scoring_method:
          type: string
          enum: [standard, irt_2pl]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        total_score:
          type: number
          format: double
        passing_score:
          type: number
          format: double
        passed:
          type: boolean
        correct_answers:
          type: integer
        wrong_answers:
          type: integer
        unanswered:
          type: integer
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectResult'
        review:
          type: array
          items:
            $ref: '#/components/schemas/AnswerReview'

    AnswerReview:
      type: object
      required: [question_id, subject_name, content_text, options, correct_answer, is_correct, explanation_text]
      properties:
        question_id:
          type: string
          format: uuid
        subject_name:
          type: string
        content_text:
          type: string
        options:
          type: array
          items:
            type: object
            required: [key, content]
            properties:
              key:
                type: string
              content:
                type: string
        selected_option:
          type: string
          nullable: true
        correct_answer:
          type: string
        is_correct:
          type: boolean
        explanation_text:
          type: string
        explanation_video_url:
          type: string
          format: uri
          nullable: true

    GlobalRankingEntry:
      type: object
      required: [rank, display_name, school_level, score, finished_at, is_current_user]
      properties:
        rank:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
          description: Email local-part used as the demo display name.
        school_level:
          type: string
          enum: [SD, SMP, SMA]
        score:
          type: number
          format: double
        finished_at:
          type: string
          format: date-time
        is_current_user:
          type: boolean

    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          example: req_01JXYZ
