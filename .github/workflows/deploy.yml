name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "docker-compose.prod.yml"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Wait for CI green
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const CI_WORKFLOWS = ["Backend CI", "Web CI"];
            const POLL_INTERVAL_MS = 30_000;
            const TIMEOUT_MS = 20 * 60 * 1000;
            const started = Date.now();

            const runsForSha = async () => {
              const data = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: sha, event: "push", per_page: 100,
              });
              return data.data.workflow_runs.filter((r) =>
                CI_WORKFLOWS.includes(r.name) && r.run_number > 0
              );
            };

            while (true) {
              const runs = await runsForSha();
              if (runs.length === 0) {
                console.log("No CI workflow runs found for this commit — nothing blocking deploy.");
                break;
              }
              const pending = runs.filter((r) => r.status === "queued" || r.status === "in_progress");
              const failed = runs.filter((r) => r.status === "completed" && r.conclusion !== "success");
              for (const r of runs) {
                console.log(`${r.name} #${r.run_number}: ${r.status} (${r.conclusion ?? "-"})`);
              }
              if (failed.length > 0) {
                core.setFailed(`CI failed for ${sha}: ${failed.map((r) => `${r.name} #${r.run_number} ${r.conclusion}`).join(", ")}`);
                break;
              }
              if (pending.length === 0) {
                console.log("All CI workflow runs for this commit are green.");
                break;
              }
              if (Date.now() - started > TIMEOUT_MS) {
                core.setFailed(`Timed out after 20m waiting on CI: ${pending.map((r) => `${r.name} #${r.run_number}`).join(", ")}`);
                break;
              }
              console.log(`Waiting for CI: ${pending.map((r) => `${r.name} #${r.run_number}`).join(", ")}...`);
              await new Promise((res) => setTimeout(res, POLL_INTERVAL_MS));
            }

  deploy:
    name: Deploy to production VPS
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          timeout: 60s
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd ~/tka
            git fetch origin main
            git pull --ff-only origin main
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
            echo "---- HEALTH ----"
            docker compose --env-file .env.production -f docker-compose.prod.yml ps
            echo "---- LIVE CHECK ----"
            cd ~/tka && LIVE_CHECK=1 sh scripts/preflight-production.sh

  notify:
    name: Post-deploy health check
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify site is live
        if: needs.deploy.result == 'success'
        run: |
          curl -fsS -o /dev/null -w "https://%{url_effective} -> HTTP %{http_code}\n" https://${{ secrets.VPS_DOMAIN || 'siap-siap.my.id' }}/
          curl -fsS -o /dev/null -w "https://%{url_effective} -> HTTP %{http_code}\n" https://${{ secrets.VPS_DOMAIN || 'siap-siap.my.id' }}/api/v1/packages