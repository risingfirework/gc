name: Backend CI

on:
  push:
    paths: ["apps/backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["apps/backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/backend/go.sum
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: apps/backend
      - name: Unit tests
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tka
          POSTGRES_PASSWORD: tka_local_password
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tka -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/backend/go.sum
      - name: Database migrations and repository integration tests
        run: go test -count=1 -tags integration ./internal/repository/postgres/ -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: false
          tags: tka/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
