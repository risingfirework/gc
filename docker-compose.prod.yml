name: tka-production

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

x-redis-common: &redis-common
  image: redis:7.4-alpine
  restart: unless-stopped
  networks: [data]
  secrets: [redis_password]
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s
  security_opt: ["no-new-privileges:true"]
  logging: *default-logging
  ulimits:
    nofile: { soft: 65536, hard: 65536 }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tka}
      POSTGRES_USER: ${POSTGRES_USER:-tka}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["exec migrate -path /migrations -database \"$$(cat /run/secrets/database_url)\" up"]
    secrets: [database_url]
    volumes:
      - ./apps/backend/db/migrations:/migrations:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging

  redis-node-1:
    <<: *redis-common
    command: ["/bin/sh", "-ec", "exec redis-server --port 6379 --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node-1 --cluster-preferred-endpoint-type hostname --requirepass \"$$(cat /run/secrets/redis_password)\" --masterauth \"$$(cat /run/secrets/redis_password)\""]
    volumes: [redis_node_1:/data]
  redis-node-2:
    <<: *redis-common
    command: ["/bin/sh", "-ec", "exec redis-server --port 6379 --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node-2 --cluster-preferred-endpoint-type hostname --requirepass \"$$(cat /run/secrets/redis_password)\" --masterauth \"$$(cat /run/secrets/redis_password)\""]
    volumes: [redis_node_2:/data]
  redis-node-3:
    <<: *redis-common
    command: ["/bin/sh", "-ec", "exec redis-server --port 6379 --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node-3 --cluster-preferred-endpoint-type hostname --requirepass \"$$(cat /run/secrets/redis_password)\" --masterauth \"$$(cat /run/secrets/redis_password)\""]
    volumes: [redis_node_3:/data]
  redis-node-4:
    <<: *redis-common
    command: ["/bin/sh", "-ec", "exec redis-server --port 6379 --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node-4 --cluster-preferred-endpoint-type hostname --requirepass \"$$(cat /run/secrets/redis_password)\" --masterauth \"$$(cat /run/secrets/redis_password)\""]
    volumes: [redis_node_4:/data]
  redis-node-5:
    <<: *redis-common
    command: ["/bin/sh", "-ec", "exec redis-server --port 6379 --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node-5 --cluster-preferred-endpoint-type hostname --requirepass \"$$(cat /run/secrets/redis_password)\" --masterauth \"$$(cat /run/secrets/redis_password)\""]
    volumes: [redis_node_5:/data]
  redis-node-6:
    <<: *redis-common
    command: ["/bin/sh", "-ec", "exec redis-server --port 6379 --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node-6 --cluster-preferred-endpoint-type hostname --requirepass \"$$(cat /run/secrets/redis_password)\" --masterauth \"$$(cat /run/secrets/redis_password)\""]
    volumes: [redis_node_6:/data]

  redis-cluster-init:
    image: redis:7.4-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/redis_password)"
        if redis-cli -h redis-node-1 -a "$$password" cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then exit 0; fi
        exec redis-cli -a "$$password" --cluster create \
          redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 \
          redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 \
          --cluster-replicas 1 --cluster-yes
    secrets: [redis_password]
    networks: [data]
    depends_on:
      redis-node-1: { condition: service_healthy }
      redis-node-2: { condition: service_healthy }
      redis-node-3: { condition: service_healthy }
      redis-node-4: { condition: service_healthy }
      redis-node-5: { condition: service_healthy }
      redis-node-6: { condition: service_healthy }
    logging: *default-logging

  backend:
    build: { context: ./apps/backend }
    image: ${BACKEND_IMAGE:-tka/backend:local}
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_CLUSTER_ADDRS: redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_DB: "0"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ISSUER: ${JWT_ISSUER:-tka-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      ALLOWED_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN in .env.production}
      PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/payment_webhook_secret
      PAYMENT_CHECKOUT_URL: ${PAYMENT_CHECKOUT_URL:?set PAYMENT_CHECKOUT_URL in .env.production}
      APP_ENVIRONMENT: production
      APP_RELEASE: ${APP_RELEASE:-unknown}
      SENTRY_DSN_FILE: /run/secrets/sentry_dsn
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    secrets: [database_url, redis_password, jwt_secret, payment_webhook_secret, sentry_dsn]
    expose: ["8080"]
    networks: [edge, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cluster-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/tka-api", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEMO_EXAM_ID: ${NEXT_PUBLIC_DEMO_EXAM_ID:-30000000-0000-0000-0000-000000000001}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: ${WEB_IMAGE:-tka/web:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose: ["3000"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/includes:/etc/nginx/includes:ro
      - ./deploy/nginx/runtime:/etc/nginx/runtime:ro
      - ${TLS_CERT_FILE:-./deploy/nginx/certs/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:-./deploy/nginx/certs/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}"
  database_url:
    file: "${DATABASE_URL_FILE:-./secrets/database_url.txt}"
  redis_password:
    file: "${REDIS_PASSWORD_FILE:-./secrets/redis_password.txt}"
  jwt_secret:
    file: "${JWT_SECRET_FILE:-./secrets/jwt_secret.txt}"
  payment_webhook_secret:
    file: "${PAYMENT_WEBHOOK_SECRET_FILE:-./secrets/payment_webhook_secret.txt}"
  sentry_dsn:
    file: "${SENTRY_DSN_FILE:-./secrets/sentry_dsn.txt}"

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_node_1:
  redis_node_2:
  redis_node_3:
  redis_node_4:
  redis_node_5:
  redis_node_6:
