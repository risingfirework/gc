user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 32768;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_authorization $api_limit_key {
        "" $binary_remote_addr;
        default $http_authorization;
    }

    limit_req_zone $api_limit_key zone=api_per_session:20m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
