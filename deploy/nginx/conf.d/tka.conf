resolver 127.0.0.11 valid=10s ipv6=off;

upstream tka_backend {
    zone tka_backend 64k;
    include /etc/nginx/runtime/backend-target.conf;
    keepalive 256;
}

upstream tka_web {
    zone tka_web 64k;
    server web:3000 resolve;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    limit_conn connections_per_ip 40;

    location = /api/v1/auth/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        proxy_pass http://tka_backend;
        include /etc/nginx/includes/proxy-common.inc;
    }

    location = /api/v1/webhooks/payment {
        limit_req zone=webhook_per_ip burst=60 nodelay;
        proxy_pass http://tka_backend;
        include /etc/nginx/includes/proxy-common.inc;
    }

    location /api/ {
        limit_req zone=api_per_session burst=30 nodelay;
        proxy_pass http://tka_backend;
        include /etc/nginx/includes/proxy-common.inc;
    }

    location / {
        proxy_pass http://tka_web;
        include /etc/nginx/includes/proxy-common.inc;
    }
}
