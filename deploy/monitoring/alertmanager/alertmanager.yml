global:
  resolve_timeout: 5m
  slack_api_url_file: /run/secrets/slack_webhook_url
  telegram_bot_token_file: /run/secrets/telegram_bot_token

route:
  receiver: ops-chat
  group_by: [alertname, component, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - receiver: ops-chat
      matchers: ['severity="critical"']
      repeat_interval: 30m

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, component]

receivers:
  - name: ops-chat
    slack_configs:
      - send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.description }}{{ "\n" }}{{ end }}'
    telegram_configs:
      - send_resolved: true
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        message: '{{ range .Alerts }}<b>{{ .Status | toUpper }}: {{ .Labels.alertname }}</b>{{ "\n" }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
